# The examples pages on useterse.ai are built from this repo. Pushing to main
# triggers a fresh deploy of the site so the pages pick up the change.
#
# Needs the repo secret VERCEL_DEPLOY_HOOK_URL: a deploy hook for the landing
# page's Vercel project (Settings → Git → Deploy Hooks, branch main). Until it
# is set, the run skips with a notice instead of failing.
# Native Mintlify docs are synced independently by TerseAI/Terse.
# Store TERSE_DOCS_DISPATCH_TOKEN only in the docs-sync environment, restricted
# to the main branch (no tags), with Actions: write access only to TerseAI/Terse.
# Never use a repository/org secret or the receiver's write token. Provision the
# protected environment and receiving workflow on Terse's main before enabling.
name: Rebuild useterse.ai examples

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  sync-docs:
    if: github.ref == 'refs/heads/main'
    environment: docs-sync
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check docs sync token
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.TERSE_DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_SYNC_TOKEN" ]; then
            echo "::error::TERSE_DOCS_DISPATCH_TOKEN is required in the main-only docs-sync environment with Actions: write access only to TerseAI/Terse."
            exit 1
          fi
      - name: Dispatch native docs sync
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.TERSE_DOCS_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'TerseAI',
              repo: 'Terse',
              workflow_id: 'sync-docs-examples.yml',
              ref: 'main',
            });

  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger a Vercel deploy of useterse.ai
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set, so the site was not rebuilt."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
